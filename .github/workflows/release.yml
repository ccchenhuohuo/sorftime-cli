name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A stable asset name keeps the documented /releases/latest/download/ URL working.
      - name: Pack
        run: |
          npm pack --pack-destination /tmp
          mv /tmp/sorftime-cli-*.tgz /tmp/sorftime-cli.tgz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" /tmp/sorftime-cli.tgz --generate-notes
